# abyss — lazygit colours
#
# lazygit has no theme files, only a gui.theme block in config.yml.
# Either merge this block into ~/.config/lazygit/config.yml, or save this file
# next to it and point lazygit at both:
#   LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/abyss.yml" lazygit
#
# To use delta for diffs in lazygit, uncomment the git.paging block.

gui:
  theme:
    activeBorderColor:
      - '#bdff00'
      - bold
    inactiveBorderColor:
      - '#4e7a81'
    searchingActiveBorderColor:
      - '#fb9d59'
      - bold
    optionsTextColor:
      - '#00bafe'
    selectedLineBgColor:
      - '#00313b'
    inactiveViewSelectedLineBgColor:
      - '#001e29'
    cherryPickedCommitFgColor:
      - '#47d6cf'
    cherryPickedCommitBgColor:
      - '#003843'
    markedBaseCommitFgColor:
      - '#00bafe'
    markedBaseCommitBgColor:
      - '#003843'
    unstagedChangesColor:
      - '#f04e4f'
    defaultFgColor:
      - default

